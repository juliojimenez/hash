name: Debian Package

on:
  release:
    types: [published, released, created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (vNN)'
        required: true

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - distro: jammy
            distro_name: ubuntu-22.04
          - distro: noble
            distro_name: ubuntu-24.04
          - distro: bookworm
            distro_name: debian-bookworm
          - distro: trixie
            distro_name: debian-trixie

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper devscripts dpkg-dev

      - name: Get Version From Tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Update Changelog
        run: |
          sed -i "s/^hash-shell ([^)]*)/hash-shell (${{ steps.get_version.outputs.version }}-1~${{ matrix.distro }})/g" debian/changelog
          sed -i "s/) unstable;/) ${{ matrix.distro }};/g" debian/changelog

      - name: Build Package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p packages
          mv ../hash-shell_*.deb packages/ || true
          mv ../hash-shell-dbgsym_*.ddeb packages/ || true
          # List what we built
          echo "Built packages:"
          ls -la packages/

      - name: Upload Package Artifact
        uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: packages/*.deb

  publish-site:
    name: Publish Documentation and APT Repository
    runs-on: ubuntu-latest
    needs: build-deb

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install APT Repository Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Get Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Site (book and APT repository)
        run: bash scripts/build-site.sh "${{ steps.get_version.outputs.version }}" artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  upload-to-release:
    name: Upload to Release
    runs-on: ubuntu-latest
    needs: build-deb
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'

    permissions:
      contents: write

    steps:
      - name: Get Tag Name
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Uploading to release: $TAG"

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List Downloaded Artifacts
        run: |
          echo "Downloaded artifacts:"
          find artifacts -name "*.deb" -ls

      - name: Upload to Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          files: artifacts/**/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
