name: Documentation

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'scripts/build-site.sh'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup mdBook
        uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: 'latest'

      - name: Install APT Repository Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Download the Latest Release's Packages
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The site carries the APT repository too; a docs deploy must not drop it
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir debs
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Build Site (book and APT repository)
        run: bash scripts/build-site.sh "${{ steps.release.outputs.version }}" debs

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
